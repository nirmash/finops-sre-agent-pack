# Proactive weekly FinOps AI Spend Live Report refresh.
#
# Like the other report tasks, this drives the built-in `live_report_authoring` skill to
# author/update a Live Report that appears in Operations Hub > Live Reports. It keeps ONE
# report named "FinOps: AI Spend" and saves a new VERSION each week (a baked-in snapshot,
# so it needs no view-time connectors and saves with no approval prompt).
#
# This is the AI-cost report: it attributes Azure AI spend per resource / model / service
# family using the finops-for-ai skill's attribute.py, deliberately covering BOTH classic
# Azure OpenAI (kind=OpenAI) AND Azure AI Foundry (kind=AIServices) accounts plus
# Microsoft.MachineLearningServices, so Foundry-hosted model spend is never dropped.
# Read-only, no POST.
#
# Requires Live Reports enabled on the agent (first-party + Operations Hub).
#
# Reference template for the task created by install-api.sh. API installation is
# upsert-by-name, so re-running the installer is idempotent.
apiVersion: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: "FinOps: AI Spend (Live Report, Weekly)"
  owner: __ALERT_EMAIL__
  tags:
    - finops
    - finops-live-report
spec:
  name: "FinOps: AI Spend (Live Report, Weekly)"
  description: >-
    Part of the FinOps pack — a weekly-refreshed Live Report (Operations Hub) of Azure AI
    spend: total AI cost, per-model and per-resource breakdowns, a token-vs-compute split, top
    cost drivers, and read-only optimization hints. Covers Azure OpenAI + AI Foundry + ML.
  agent: __AGENT_NAME__
  cron: __AI_REPORT_CRON__
  modelTier: ReasoningHeavy
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query,
    email, ListReports/GetReport call, or SaveReport call:
    0. Load `finops-managed-scope` and follow its `scope.py` procedure using agent
       resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the agent's current
       `managedResources`; do not use a cached list. Validate and normalize every
       scope, expand only to Azure descendants, and use that effective scope set as
       the sole analysis boundary.
       - If discovery fails, is malformed, or returns an empty list, FAIL CLOSED:
         stop without querying analysis data, sending email, or creating/updating/
         saving a report. State the scope error only.
       - This scheduled task accepts NO override or broader user/requested scope.
         Broad RBAC/visibility must never expand the boundary.
       - Query each effective scope independently where the API supports scoped
         retrieval; paginate each independently, de-duplicate overlaps, filter all
         results against the boundary, and disclose included, excluded, unattributed,
         unsupported, and partial/failed scope coverage.

    Create or update a Live Report now using the `live_report_authoring` skill.
    This is an explicit request to author and SAVE a Live Report — proceed without
    asking any questions and do not defer it to chat.

    Report: a FinOps Azure AI spend breakdown for the current managed Azure scopes.

    Idempotent weekly refresh — keep ONE report and version it:
    1. Call ListReports. If a report named exactly "FinOps: AI Spend" already exists, call
       GetReport to check it out and reuse its reportId; pass that reportId to SaveReport
       (saving a new VERSION). If it does not exist, omit reportId (create it).

    This is a SNAPSHOT report, not a connector-backed live report:
    2. Pull the data NOW per effective managed scope using the read-only
       `finops-for-ai` skill. Read its SKILL.md and
       follow it: pull the modern Consumption UsageDetails line items with bounded `$top`,
       minimal field projection, and complete `nextLink` pagination; lower `$top` on 413 and
       use verified date slices only as a final fallback. PROJECT the extra fields
       consumedService + meterSubCategory + meterName (needed to classify AI spend and parse
       the model), then KEEP ONLY rows whose
       consumedService is Microsoft.CognitiveServices or Microsoft.MachineLearningServices
       (case-insensitive). Do NOT filter on kind or on a meter category — that would drop
       Foundry AIServices accounts. Do NOT use `az rest --method post` or the Cost Management
       Query API — POST is blocked as a write. Optionally pull each resource's `kind` via a
       Resource Graph GET to label OpenAI vs AIServices vs the ML kind, using
       `az graph query --subscriptions <EFFECTIVE_SUBSCRIPTION_ID> ...` once per
       unique effective subscription. For an RG-only scope, add the exact
       case-insensitive `resourceGroup =~ '<EFFECTIVE_RESOURCE_GROUP>'` predicate
       and client-side filter ids to the exact normalized RG ARM prefix. Retain
       those constraints on every page and de-duplicate overlapping scopes.
    3. Read the skill's attribute.py into the sandbox and run
       attribute_ai_costs(line_items=..., resource_kinds=...) to get total AI spend, the
       service-family split, the token-vs-compute meter split, per-resource and per-model
       breakdowns, top drivers, and the read-only hints.
    4. BAKE the results directly into the HTML as static data (a JS constant / static DOM).
       Do NOT use window.sreagent.callTool anywhere — the report must render fully with no
       view-time tool calls. Call SaveReport with allowedTools set to an EMPTY list (so it
       saves with no connector-approval prompt).
       - name: "FinOps: AI Spend"
       - description: one sentence noting it is a weekly-refreshed snapshot of Azure AI spend
         (OpenAI + Foundry + ML), part of the FinOps pack, as of today's date.
    5. Content: a HEADLINE row (total AI spend, resource count, model count, and the
       model-token vs compute dollar split); a Chart.js bar chart of the top models by spend;
       a by-model table (model, monthly $, % of model spend, # resources); a by-resource table
       (resource, kind, service family, top model, monthly $); the top cost drivers; and the
       hints as a "where to look first" list. NEVER sum model-token and compute dollars into a
       single number — they are different cost drivers. Mark PTU/commitment and
       compute-with-no-tokens hints as estimates / "verify first" (true idle detection needs
       utilization metrics). Single self-contained HTML file; follow the skill's CSP/nonce
       rules and copy the exact SRI library tags from the reference files. Light mode. Wrap
       every render block defensively with a small empty-state (a subscription may have no AI
       spend — say so clearly). Render a visible "Last refreshed: <UTC date-time> UTC" line in
       the report header — compute the current UTC timestamp in the sandbox at author time
       (e.g. Python datetime.now(timezone.utc)) and BAKE it in as static text so a viewer can
       always see how fresh the data is; note near it that Azure cost data settles ~daily.

    Read-only Azure only. Do not use any write/POST Azure operations. When done, confirm the
    saved report id and version number.
