# Proactive daily cost-anomaly scan.
#
# Reference template for the task created by install-api.sh. The API installer
# renders equivalent values from environment variables before upserting the task.
#
# Apply is upsert-by-name, so re-running is idempotent.
apiVersion: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: "FinOps: Cost Anomaly Detection (Daily)"
  owner: __ALERT_EMAIL__
  tags:
    - finops
    - finops-cost-anomaly-detection
spec:
  name: "FinOps: Cost Anomaly Detection (Daily)"
  description: >-
    Part of the FinOps pack — installed with the finops-cost-anomaly-detection skill.
    Proactive daily cost-anomaly scan; reports only when a spike is detected and
    correlates it to the causing change.
  agent: __AGENT_NAME__
  cron: __CRON__
  modelTier: ReasoningHeavy
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query,
    email, ListReports/GetReport call, or SaveReport call:
    0. Load `finops-managed-scope` and follow its `scope.py` procedure using agent
       resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the agent's current
       `managedResources`; do not use a cached list. Validate and normalize every
       scope, expand only to Azure descendants, and use that effective scope set as
       the sole analysis boundary.
       - If discovery fails, is malformed, or returns an empty list, FAIL CLOSED:
         stop without querying analysis data, sending email, or creating/updating/
         saving a report. State the scope error only.
       - This scheduled task accepts NO override or broader user/requested scope.
         Broad RBAC/visibility must never expand the boundary.
       - Query each effective scope independently where the API supports scoped
         retrieval; paginate each independently, de-duplicate overlaps, filter all
         results against the boundary, and disclose included, excluded, unattributed,
         unsupported, and partial/failed scope coverage.

    Run the `finops-cost-anomaly-detection` skill for every effective managed scope.
    Read-only.
    Follow the skill's procedure exactly:

    1. Load the skill — read its SKILL.md so you use the bundled detector and steps.
    2. Step 1 (pull): independently GET Consumption UsageDetails (ActualCost) for
       every effective scope for the last 35 days via
       `az rest --method get` with `&$top=1000`, projecting to just the needed fields with
       `--query "{value: value[].{date: properties.date, cost: properties.costInUSD,
       meterCategory: properties.meterCategory, resourceGroup: properties.resourceGroup,
       resourceId: properties.instanceName, tags: tags}, nextLink: nextLink}"`, and paginate
       every `nextLink`. If a request 413s, lower `$top` (1000→100→20). Only if bounded pages
       still fail, use short `usageStart` date slices as a fallback; verify returned dates
       because the filter is not reliably applied, then de-duplicate combined rows. `--query`
       is client-side and keeps retained JSON small but does not itself prevent a server 413.
       `nextLink` in the body is HTML-escaped (`&amp;`) — decode before following. resourceId
       comes from properties.instanceName, falling back to properties.resourceId (resourceId
       is null in modern billing). If the pull cannot complete, keep partial rows but label
       downstream totals "partial — cost pull truncated".
    3. Step 2 (detect): write the skill's embedded detect.py to the sandbox and run
       `detect_anomalies(line_items)` with defaults (baseline_days=28, k=3.0,
       min_delta_usd=5.0, wow_ratio=1.5). Keep assume_last_partial=True so the partial
       newest billing day is excluded.
    4. Step 3 (correlate): for EACH anomaly, search only its effective managed
       scope's subscription/resource-group
       deployments, activity-log write ops, and GitHub commits + merged PRs
       (repo __GITHUB_REPO__) within +/-1 day of the spike date, and attach the most
       likely cause.
    5. Step 4 (report):
       - If NO anomalies are detected, reply with a single line
         "No cost anomalies detected for <date>." and stop. Do not email.
       - If one or more anomalies ARE detected, produce a ranked table (dimension, value,
         kind, current_usd, baseline_mean_usd, dod_delta_usd, %change, candidate cause) and
         email the report to __ALERT_EMAIL__ with subject "Cost anomaly detected — <date>"
         and High importance.

    Read-only only. Do not use any write/POST Azure operations.
