# Proactive daily FinOps Live Report refresh.
#
# Unlike the other two tasks, this one does not run a finops-* skill — it drives
# the built-in `live_report_authoring` skill to author/update a Live Report that
# appears in Operations Hub > Live Reports. It keeps ONE report named
# "FinOps: Cost Overview" and saves a new VERSION each day (a baked-in snapshot,
# so it needs no view-time connectors and saves with no approval prompt).
#
# Requires Live Reports enabled on the agent (first-party + Operations Hub).
#
# Reference template for the task created by install-api.sh. API installation is
# upsert-by-name, so re-running the installer is idempotent.
apiVersion: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: "FinOps: Cost Overview (Live Report, Daily)"
  owner: __ALERT_EMAIL__
  tags:
    - finops
    - finops-live-report
spec:
  name: "FinOps: Cost Overview (Live Report, Daily)"
  description: >-
    Part of the FinOps pack — a daily-refreshed Live Report (Operations Hub)
    snapshot of Azure cost: total, daily trend, top services, and top resource
    groups.
  agent: __AGENT_NAME__
  cron: __CRON__
  modelTier: ReasoningHeavy
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure analysis query,
    email, ListReports/GetReport call, or SaveReport call:
    0. Load `finops-managed-scope` and follow its `scope.py` procedure using agent
       resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the agent's current
       `managedResources`; do not use a cached list. Validate and normalize every
       scope, expand only to Azure descendants, and use that effective scope set as
       the sole analysis boundary.
       - If discovery fails, is malformed, or returns an empty list, FAIL CLOSED:
         stop without querying analysis data, sending email, or creating/updating/
         saving a report. State the scope error only.
       - This scheduled task accepts NO override or broader user/requested scope.
         Broad RBAC/visibility must never expand the boundary.
       - Query each effective scope independently where the API supports scoped
         retrieval; paginate each independently, de-duplicate overlaps, filter all
         results against the boundary, and disclose included, excluded, unattributed,
         unsupported, and partial/failed scope coverage.

    Create or update a Live Report now using the `live_report_authoring` skill.
    This is an explicit request to author and SAVE a Live Report — proceed without
    asking any questions and do not defer it to chat.

    Report: a FinOps cost overview snapshot for the current managed Azure scopes.

    Idempotent daily refresh — keep ONE report and version it:
    1. Call ListReports. If a report named exactly "FinOps: Cost Overview" already
       exists, call GetReport to check it out and reuse its reportId; pass that
       reportId to SaveReport (saving a new VERSION). If it does not exist, omit
       reportId (create it).

    This is a SNAPSHOT report, not a connector-backed live report:
    2. Pull the data NOW, at authoring time, per effective managed scope using
       read-only Azure cost commands.
       Use `az rest --method get` against Consumption UsageDetails (ActualCost) for
       the last 30 days with `&$top=1000`, projecting to just the needed fields with
       `--query "{value: value[].{date: properties.date, cost: properties.costInUSD,
       meterCategory: properties.meterCategory, resourceGroup: properties.resourceGroup,
       resourceId: properties.instanceName, tags: tags}, nextLink: nextLink}"`, and paginate
       every `nextLink`. On 413 lower `$top` (1000→100→20). Only if bounded pages still fail,
       use short `usageStart` date slices as a fallback; verify returned dates and de-duplicate
       combined rows because the filter is not reliably applied. `--query` is client-side and
       keeps retained JSON small but does not itself prevent a server 413. If the pull cannot
       complete, keep partial rows but label the
       report totals "partial — cost pull truncated". Do NOT use `az rest --method post`
       or the Cost Management Query API — POST is blocked as a write. Read costInUSD;
       take the resource id from properties.instanceName, falling back to
       properties.resourceId (resourceId is null in modern billing).
    3. Aggregate with in-sandbox Python into: (a) total spend for the window and a
       daily total time-series, (b) top 8 services by cost (meterCategory), (c) top
       8 resource groups by cost.
    4. BAKE the numbers directly into the HTML as static data (a JS constant /
       static DOM). Do NOT use window.sreagent.callTool anywhere — the report must
       render fully with no view-time tool calls. Call SaveReport with allowedTools
       set to an EMPTY list (so it saves with no connector-approval prompt).
       - name: "FinOps: Cost Overview"
       - description: one sentence noting it is a daily-refreshed snapshot of Azure
         cost, part of the FinOps pack, as of today's date.
    5. Author a single self-contained HTML file. Follow the skill's CSP/nonce rules
       and copy the exact SRI library tags from the reference files (use Chart.js for
       the daily line chart). Light mode. Wrap every render block defensively with a
       small empty-state. Render a visible "Last refreshed: <UTC date-time> UTC" line
       in the report header — compute the current UTC timestamp in the sandbox at
       author time (e.g. Python datetime.now(timezone.utc)) and BAKE it in as static
       text so a viewer can always see how fresh the data is. Also note the cost-data
       settling lag (Azure UsageDetails settle ~daily) near that line.

    Read-only Azure only. Do not use any write/POST Azure operations. When done,
    confirm the saved report id and version number.
