# Proactive weekly rightsizing / savings review.
#
# Reference template for the task created by install-api.sh. The API installer
# renders equivalent values from environment variables before upserting the task.
#
# Apply is upsert-by-name, so re-running is idempotent.
apiVersion: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: "FinOps: Rightsizing Review (Weekly)"
  owner: __ALERT_EMAIL__
  tags:
    - finops
    - finops-rightsizing-advisor
spec:
  name: "FinOps: Rightsizing Review (Weekly)"
  description: >-
    Part of the FinOps pack — installed with the finops-rightsizing-advisor skill.
    Weekly read-only rightsizing / idle-resource review; reports ranked savings
    opportunities validated against real utilization and cost.
  agent: __AGENT_NAME__
  cron: __CRON__
  modelTier: ReasoningHeavy
  agentPrompt: |
    Run the `finops-rightsizing-advisor` skill for subscription __SUB_ID__. Read-only.
    Follow the skill's procedure exactly:

    1. Load the skill — read its SKILL.md so you use the bundled rightsize.py and steps.
    2. Step 1 (Advisor): `az advisor recommendation list --category Cost` and flatten to
       {resourceId, problem, recommendation, targetSku, savingsUsd}.
    3. Step 2 (inventory): `az graph query` for VMs, disks, App Service plans, Azure
       Container Apps (managedenvironments + containerapps), and dynamic session pools
       (microsoft.app/sessionpools — these do NOT show in `az resource list` and often top
       the bill); flatten to {resourceId, type, sku, powerState, diskState, numberOfSites,
       environmentId, minReplicas, readySessionInstances, tags}.
    4. Step 3 (utilization): for each VM candidate, `az monitor metrics list` "Percentage CPU"
       over the last 14 days; reduce to {cpu_p95, cpu_avg, mem_p95, sample_days}.
    5. Step 3b (activity): for each Container App, `az monitor metrics list` "Requests" (Total,
       P1D) over 14 days; for each session pool, "SessionApiRequestCount" (Total, P1D) over 14
       days (retry once or twice — the sessionPools metric namespace is flaky). Reduce to
       {resourceId: {requests_total, sample_days}} — flags unused ACA environments, always-on
       apps with no traffic, and warm session pools with no sessions.
    6. Step 4 (cost): GET Consumption UsageDetails (ActualCost) for ~30 days via
       `az rest --method get` with `&$top=1000`, projecting to just the needed fields with
       `--query "{value: value[].{date: properties.date, cost: properties.costInUSD,
       resourceGroup: properties.resourceGroup, resourceId: properties.instanceName, tags: tags},
       nextLink: nextLink}"`, and paginate every `nextLink`. If a request 413s, lower `$top`
       (1000→100→20). Only if bounded pages still fail, use short `usageStart` date slices as a
       fallback; verify returned dates because the filter is not reliably applied, then
       de-duplicate combined rows. `--query` is client-side and keeps retained JSON small but
       does not itself prevent a server 413. Aggregate costInUSD by resourceId into
       {resourceId: monthly_usd}. If the pull cannot complete, keep partial rows but label
       savings totals "partial — cost pull truncated".
    7. Step 5 (rank): write the skill's rightsize.py to the sandbox and run
       `recommend_rightsizing(resources=..., utilization=..., activity=..., costs=..., advisor=...)`.
    8. Step 6 (report):
       - If NOTHING clears the savings threshold, reply with a single line
         "No rightsizing opportunities above threshold this week." and stop. Do not email.
       - Otherwise produce a ranked table (resource, type, kind, current SKU, recommended
         action, current monthly $, est monthly savings $, validated, evidence) with the
         TOTAL estimated monthly savings at the top, mark validated=false / unvalidated rows
         as "verify first", and email the report to __ALERT_EMAIL__ with subject
         "Weekly rightsizing review — <date>" and Normal importance.

    Recommend only. Read-only. Do not use any write/POST Azure operations.
